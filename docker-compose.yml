services:
  postgres:
    image: postgres:17-alpine
    container_name: schemka-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-schemka}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-schemka}
      POSTGRES_DB: ${POSTGRES_DB:-schemka}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      # Ліворуч — порт на хості (для psql/GUI та локального npm run start:dev).
      # 127.0.0.1 — щоб БД з дефолтним паролем не була видна всій локальній мережі.
      - '127.0.0.1:${POSTGRES_PORT:-5444}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-schemka} -d ${POSTGRES_DB:-schemka}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  garage:
    image: dxflrs/garage:v2.5.0
    container_name: schemka-garage
    restart: unless-stopped
    # Layout, ключ і бакет Garage створює сам на першому старті (і не чіпає на
    # наступних), тож окремого кроку ініціалізації немає — як і в Coolify.
    command: ['/garage', 'server', '--single-node', '--default-bucket']
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:-randomsecret}
      # Ті самі змінні читає застосунок, щоб ключ і бакет не розʼїхались.
      GARAGE_DEFAULT_ACCESS_KEY: ${S3_ACCESS_KEY_ID:-randomaccesskey}
      GARAGE_DEFAULT_SECRET_KEY: ${S3_SECRET_ACCESS_KEY:-ffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffff}
      GARAGE_DEFAULT_BUCKET: ${S3_BUCKET:-files}
    ports:
      # Лише S3 API; RPC (3901) потрібен тільки вузлам кластера.
      - '127.0.0.1:3900:3900'
    volumes:
      - ./docker/garage/garage.toml:/etc/garage.toml:ro
      - garage-data:/var/lib/garage
    healthcheck:
      # Образ без shell, тож перевірка — сам бінарник garage.
      test: ['CMD', '/garage', 'status']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  api:
    build:
      context: .
      target: production
    container_name: schemka-api
    restart: unless-stopped
    # tini як PID 1 — пересилає SIGTERM у node і прибирає зомбі-процеси.
    init: true
    env_file: .env
    environment:
      # Усередині compose-мережі БД — за іменем сервісу та внутрішнім портом 5432.
      # POSTGRES_PORT з .env (5444) стосується лише мапінгу на хост.
      DB_HOST: postgres
      POSTGRES_PORT: 5432
      # Міграції прогоняються на старті контейнера.
      DB_MIGRATIONS_RUN: 'true'
      S3_ENDPOINT: http://garage:3900
      # Образ збирається з NODE_ENV=production, а там порожній CORS_ORIGINS
      # вимикає CORS зовсім — тож локальний Vite-фронт треба дозволити явно.
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
    ports:
      - '127.0.0.1:${PORT:-3008}:${PORT:-3008}'
    depends_on:
      postgres:
        condition: service_healthy
      garage:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:'+(process.env.PORT||3008)+'/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  postgres-data:
    name: schemka-postgres-data
  garage-data:
    name: schemka-garage-data
