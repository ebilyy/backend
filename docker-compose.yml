services:
  postgres:
    image: postgres:17-alpine
    container_name: schemka-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-schemka}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-schemka}
      POSTGRES_DB: ${POSTGRES_DB:-schemka}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - '${POSTGRES_PORT:-5444}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-schemka} -d ${POSTGRES_DB:-schemka}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres-data:
    name: schemka-postgres-data
